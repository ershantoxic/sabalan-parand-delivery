name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none .

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build production release APK
        run: flutter build apk --release --dart-define=API_URL=https://api.sabalanparand.xyz/api

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabalan-parand-delivery-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
